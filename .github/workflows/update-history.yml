name: Update Monthly Historical Weather

on:
  # =====================================================
  # AUTOMATIC DAILY RUN
  # =====================================================
  #
  # 4:50 AM UTC = 11:50 PM Central during daylight
  # saving time.
  #
  # Manual runs remain available.
  #
  schedule:
    - cron: "50 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE WEATHER DATA
      # =====================================================

      - name: Update weather data
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]

          DAILY_FILE = "weather-daily.json"
          HISTORY_FILE = "history.json"
          README_FILE = "README.md"

          LOCATIONS = {
              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }
          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # Only use completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1
          current_month = yesterday.month

          month_name = yesterday.strftime("%B")

          completed_day = yesterday.day


          # =================================================
          # HELPER: LAST DAY OF MONTH
          # =================================================

          def last_day_of_month(year, month):

              if month == 12:

                  next_month = date(
                      year + 1,
                      1,
                      1
                  )

              else:

                  next_month = date(
                      year,
                      month + 1,
                      1
                  )

              return (
                  next_month - timedelta(days=1)
              ).day


          # =================================================
          # COMPARISON DATES
          # =================================================

          current_start = date(
              current_year,
              current_month,
              1
          )

          current_end = yesterday


          previous_start = date(
              previous_year,
              current_month,
              1
          )

          previous_end_day = min(
              completed_day,
              last_day_of_month(
                  previous_year,
                  current_month
              )
          )

          previous_end = date(
              previous_year,
              current_month,
              previous_end_day
          )


          # =================================================
          # LOAD DAILY CACHE
          # =================================================

          if os.path.exists(DAILY_FILE):

              with open(
                  DAILY_FILE,
                  "r"
              ) as file:

                  daily_data = json.load(file)

          else:

              daily_data = {
                  "locations": {}
              }


          if "locations" not in daily_data:

              daily_data["locations"] = {}


          # =================================================
          # ENSURE LOCATION STRUCTURE
          # =================================================

          for zip_code in LOCATIONS:

              if zip_code not in daily_data["locations"]:

                  daily_data["locations"][zip_code] = {

                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"],

                      "days": {}

                  }

              elif "days" not in daily_data[
                  "locations"
              ][zip_code]:

                  daily_data[
                      "locations"
                  ][zip_code]["days"] = {}


          # =================================================
          # VISUAL CROSSING REQUEST
          # =================================================

          total_query_cost = 0


          def get_weather(
              zip_code,
              start_date,
              end_date
          ):

              global total_query_cost


              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              print("")
              print(
                  "Visual Crossing request:",
                  flush=True
              )

              print(
                  f"  Location: {zip_code}",
                  flush=True
              )

              print(
                  f"  Dates: "
                  f"{start_date} through {end_date}",
                  flush=True
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "GitHub-Actions-Monthly-Weather/1.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.loads(
                          response.read().decode()
                      )


              except urllib.error.HTTPError as error:

                  try:

                      error_body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                  except Exception:

                      error_body = (
                          "Unable to read error response."
                      )


                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  print(
                      f"Visual Crossing HTTP ERROR "
                      f"{error.code}",
                      flush=True
                  )

                  print(
                      f"ZIP: {zip_code}",
                      flush=True
                  )

                  print(
                      f"Date range: "
                      f"{start_date} through {end_date}",
                      flush=True
                  )

                  print(
                      error_body,
                      flush=True
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  raise RuntimeError(
                      f"Visual Crossing request failed "
                      f"with HTTP {error.code}."
                  )


              query_cost = data.get(
                  "queryCost",
                  0
              )

              total_query_cost += query_cost


              print(
                  f"  Query cost: {query_cost}",
                  flush=True
              )


              return data


          # =================================================
          # STORE DAILY RECORDS
          # =================================================

          def store_days(
              zip_code,
              data
          ):

              days = data.get(
                  "days",
                  []
              )


              for day in days:

                  weather_date = day.get(
                      "datetime"
                  )


                  if not weather_date:

                      continue


                  daily_data[
                      "locations"
                  ][
                      zip_code
                  ][
                      "days"
                  ][weather_date] = {

                      "temp":
                          day.get("temp"),

                      "tempmax":
                          day.get("tempmax"),

                      "tempmin":
                          day.get("tempmin"),

                      "precip":
                          day.get("precip", 0) or 0

                  }


          # =================================================
          # FIND MISSING DATES
          # =================================================

          def missing_dates(
              zip_code,
              start_date,
              end_date
          ):

              existing = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]


              missing = []

              current = start_date


              while current <= end_date:

                  date_string = str(current)


                  if date_string not in existing:

                      missing.append(current)


                  current += timedelta(days=1)


              return missing


          # =================================================
          # FETCH MISSING DATA
          # =================================================

          # Seven-day batches keep the initial bootstrap
          # controlled and make API usage easy to monitor.

          BATCH_SIZE = 7


          for zip_code, location in LOCATIONS.items():

              print("")
              print(
                  "========================================",
                  flush=True
              )

              print(
                  f"Checking {location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}",
                  flush=True
              )

              print(
                  "========================================",
                  flush=True
              )


              current_missing = missing_dates(
                  zip_code,
                  current_start,
                  current_end
              )


              previous_missing = missing_dates(
                  zip_code,
                  previous_start,
                  previous_end
              )


              print(
                  f"Missing current-year days: "
                  f"{len(current_missing)}",
                  flush=True
              )

              print(
                  f"Missing previous-year days: "
                  f"{len(previous_missing)}",
                  flush=True
              )


              # ---------------------------------------------
              # CURRENT YEAR
              # ---------------------------------------------

              for i in range(
                  0,
                  len(current_missing),
                  BATCH_SIZE
              ):

                  batch = current_missing[
                      i:i + BATCH_SIZE
                  ]


                  data = get_weather(
                      zip_code,
                      batch[0],
                      batch[-1]
                  )


                  store_days(
                      zip_code,
                      data
                  )


              # ---------------------------------------------
              # PREVIOUS YEAR
              # ---------------------------------------------

              for i in range(
                  0,
                  len(previous_missing),
                  BATCH_SIZE
              ):

                  batch = previous_missing[
                      i:i + BATCH_SIZE
                  ]


                  data = get_weather(
                      zip_code,
                      batch[0],
                      batch[-1]
                  )


                  store_days(
                      zip_code,
                      data
                  )


          # =================================================
          # CALCULATE STATISTICS
          # =================================================

          def calculate(
              zip_code,
              start_date,
              end_date
          ):

              days = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]


              temperatures = []
              highs = []
              lows = []
              rainfall = 0


              current = start_date


              while current <= end_date:

                  date_string = str(current)


                  if date_string not in days:

                      raise RuntimeError(
                          f"Missing cached weather data "
                          f"for {zip_code} on "
                          f"{date_string}."
                      )


                  day = days[date_string]


                  if day.get("temp") is not None:

                      temperatures.append(
                          day["temp"]
                      )


                  if day.get("tempmax") is not None:

                      highs.append(
                          day["tempmax"]
                      )


                  if day.get("tempmin") is not None:

                      lows.append(
                          day["tempmin"]
                      )


                  rainfall += (
                      day.get("precip", 0)
                      or 0
                  )


                  current += timedelta(days=1)


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # CALCULATE LOCATION RESULTS
          # =================================================

          results = {}


          for zip_code, location in LOCATIONS.items():

              current_stats = calculate(
                  zip_code,
                  current_start,
                  current_end
              )


              previous_stats = calculate(
                  zip_code,
                  previous_start,
                  previous_end
              )


              results[zip_code] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_stats,

                  "previous":
                      previous_stats,

                  "change": {

                      "avgTemp":
                          round(
                              current_stats["avgTemp"]
                              - previous_stats["avgTemp"],
                              1
                          ),

                      "highTemp":
                          round(
                              current_stats["highTemp"]
                              - previous_stats["highTemp"],
                              1
                          ),

                      "lowTemp":
                          round(
                              current_stats["lowTemp"]
                              - previous_stats["lowTemp"],
                              1
                          ),

                      "rainfall":
                          round(
                              current_stats["rainfall"]
                              - previous_stats["rainfall"],
                              2
                          )

                  }

              }


          # =================================================
          # PHOCAS HISTORY.JSON
          # =================================================

          output = {

              "generated":
                  str(today),

              "month":
                  month_name,

              "currentYear":
                  current_year,

              "previousYear":
                  previous_year,

              "daysIncluded":
                  completed_day,

              "currentPeriod":
                  f"{current_start} through {current_end}",

              "previousPeriod":
                  f"{previous_start} through {previous_end}",

              "weather": [

                  {
                      "metric":
                          "Average Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      }

                  },

                  {
                      "metric":
                          "High Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      }

                  },

                  {
                      "metric":
                          "Low Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      }

                  },

                  {
                      "metric":
                          "Rainfall",

                      "unit":
                          "in",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      }

                  }

              ],

              "locations": [

                  {
                      "zip":
                          zip_code,

                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"]

                  }

                  for zip_code in LOCATIONS

              ]

          }


          # =================================================
          # HELPER: FORMAT CHANGE
          # =================================================

          def format_change(
              value,
              unit="°"
          ):

              if value is None:

                  return "—"


              if value > 0:

                  return f"🟢 +{value}{unit}"


              if value < 0:

                  return f"🔵 −{abs(value)}{unit}"


              return f"⚪ 0.0{unit}"


          # =================================================
          # HELPER: FORMAT RAINFALL CHANGE
          # =================================================

          def format_rain_change(
              value
          ):

              if value is None:

                  return "—"


              if value > 0:

                  return f"🟢 +{value:.2f}\""


              if value < 0:

                  return f"🔵 −{abs(value):.2f}\""


              return '⚪ 0.00"'


          # =================================================
          # BUILD GITHUB README
          # =================================================

          location_order = [
              "63045",
              "65202",
              "42003"
          ]


          readme = []


          readme.append(
              f"# 🌤️ {month_name} "
              f"{current_year} Weather Comparison"
          )


          readme.append("")


          readme.append(
              f"### {month_name} {current_year} "
              f"vs. {month_name} {previous_year}"
          )


          readme.append("")


          readme.append(
              f"Weather through **{yesterday.strftime('%B %-d, %Y')}** "
              f"for our three locations."
          )


          readme.append("")


          # -------------------------------------------------
          # LOCATION HEADER
          # -------------------------------------------------

          readme.append(
              "| | **Earth City** | **Columbia** | **Paducah** |"
          )

          readme.append(
              "|---|---:|---:|---:|"
          )


          # -------------------------------------------------
          # AVERAGE TEMPERATURE
          # -------------------------------------------------

          readme.append(
              "| 🌡️ **Average Temperature** | "
              f"**{results['63045']['current']['avgTemp']}°** | "
              f"**{results['65202']['current']['avgTemp']}°** | "
              f"**{results['42003']['current']['avgTemp']}°** |"
          )


          readme.append(
              "| ↳ vs. Last Year | "
              f"{format_change(results['63045']['change']['avgTemp'])} | "
              f"{format_change(results['65202']['change']['avgTemp'])} | "
              f"{format_change(results['42003']['change']['avgTemp'])} |"
          )


          # -------------------------------------------------
          # HIGH TEMPERATURE
          # -------------------------------------------------

          readme.append(
              "| 🔥 **High Temperature** | "
              f"**{results['63045']['current']['highTemp']}°** | "
              f"**{results['65202']['current']['highTemp']}°** | "
              f"**{results['42003']['current']['highTemp']}°** |"
          )


          readme.append(
              "| ↳ vs. Last Year | "
              f"{format_change(results['63045']['change']['highTemp'])} | "
              f"{format_change(results['65202']['change']['highTemp'])} | "
              f"{format_change(results['42003']['change']['highTemp'])} |"
          )


          # -------------------------------------------------
          # LOW TEMPERATURE
          # -------------------------------------------------

          readme.append(
              "| ❄️ **Low Temperature** | "
              f"**{results['63045']['current']['lowTemp']}°** | "
              f"**{results['65202']['current']['lowTemp']}°** | "
              f"**{results['42003']['current']['lowTemp']}°** |"
          )


          readme.append(
              "| ↳ vs. Last Year | "
              f"{format_change(results['63045']['change']['lowTemp'])} | "
              f"{format_change(results['65202']['change']['lowTemp'])} | "
              f"{format_change(results['42003']['change']['lowTemp'])} |"
          )


          # -------------------------------------------------
          # RAINFALL
          # -------------------------------------------------

          readme.append(
              '| 🌧️ **Rainfall** | '
              f"**{results['63045']['current']['rainfall']:.2f}\"** | "
              f"**{results['65202']['current']['rainfall']:.2f}\"** | "
              f"**{results['42003']['current']['rainfall']:.2f}\"** |"
          )


          readme.append(
              "| ↳ vs. Last Year | "
              f"{format_rain_change(results['63045']['change']['rainfall'])} | "
              f"{format_rain_change(results['65202']['change']['rainfall'])} | "
              f"{format_rain_change(results['42003']['change']['rainfall'])} |"
          )


          readme.append("")


          # -------------------------------------------------
          # LEGEND
          # -------------------------------------------------

          readme.append(
              "### 📊 How to read the comparison"
          )


          readme.append("")


          readme.append(
              "- 🟢 **Positive** = higher/more than last year"
          )

          readme.append(
              "- 🔵 **Negative** = lower/less than last year"
          )

          readme.append(
              '- ⚪ **No change** = same as last year'
          )


          readme.append("")


          # -------------------------------------------------
          # PERIOD INFORMATION
          # -------------------------------------------------

          readme.append(
              "### 📅 Reporting Period"
          )


          readme.append("")


          readme.append(
              f"- **Current:** "
              f"{current_start} through {current_end}"
          )

          readme.append(
              f"- **Previous:** "
              f"{previous_start} through {previous_end}"
          )


          readme.append("")


          readme.append(
              "---"
          )


          readme.append("")


          readme.append(
              "*Weather data is automatically updated daily.*"
          )


          readme.append(
              "*Source: Visual Crossing Weather Data.*"
          )


          readme_text = "\n".join(readme) + "\n"


          # =================================================
          # WRITE FILES
          # =================================================

          with open(
              DAILY_FILE,
              "w"
          ) as file:

              json.dump(
                  daily_data,
                  file,
                  indent=2
              )


          with open(
              HISTORY_FILE,
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          with open(
              README_FILE,
              "w"
          ) as file:

              file.write(
                  readme_text
              )


          # =================================================
          # FINAL REPORT
          # =================================================

          total_cached_records = sum(

              len(
                  location["days"]
              )

              for location
              in daily_data["locations"].values()

          )


          print("")
          print(
              "========================================",
              flush=True
          )

          print(
              "WEATHER UPDATE COMPLETE",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )

          print(
              f"Comparison: "
              f"{month_name} {current_year} "
              f"vs "
              f"{month_name} {previous_year}",
              flush=True
          )

          print(
              f"Completed days: "
              f"{completed_day}",
              flush=True
          )

          print(
              f"Visual Crossing query cost this run: "
              f"{total_query_cost}",
              flush=True
          )

          print(
              f"Cached daily records: "
              f"{total_cached_records}",
              flush=True
          )

          print(
              "Generated:",
              flush=True
          )

          print(
              f"  - {DAILY_FILE}",
              flush=True
          )

          print(
              f"  - {HISTORY_FILE}",
              flush=True
          )

          print(
              f"  - {README_FILE}",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )

          PY


      # =====================================================
      # COMMIT UPDATED FILES
      # =====================================================

      - name: Commit updated weather data
        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add \
            history.json \
            weather-daily.json \
            README.md

          git diff --cached --quiet || \
            git commit \
            -m "Update monthly weather report"

          git push
