name: Update Monthly Historical Weather

on:
  # =====================================================
  # AUTOMATIC DAILY RUN
  # =====================================================
  #
  # 4:50 AM UTC = 11:50 PM Central during daylight saving
  # time.
  #
  # Manual runs remain available from GitHub Actions.
  #
  schedule:
    - cron: "50 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE MONTHLY WEATHER DATA
      # =====================================================

      - name: Update weather data
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]

          DAILY_FILE = "weather-daily.json"
          HISTORY_FILE = "history.json"

          LOCATIONS = {
              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }
          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # Only use completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1
          current_month = yesterday.month

          month_name = yesterday.strftime("%B")

          completed_day = yesterday.day


          # =================================================
          # HELPER: LAST DAY OF MONTH
          # =================================================

          def last_day_of_month(year, month):

              if month == 12:

                  next_month = date(
                      year + 1,
                      1,
                      1
                  )

              else:

                  next_month = date(
                      year,
                      month + 1,
                      1
                  )

              return (
                  next_month - timedelta(days=1)
              ).day


          # =================================================
          # DETERMINE COMPARISON DATES
          # =================================================

          current_start = date(
              current_year,
              current_month,
              1
          )

          current_end = yesterday


          previous_start = date(
              previous_year,
              current_month,
              1
          )

          previous_end_day = min(
              completed_day,
              last_day_of_month(
                  previous_year,
                  current_month
              )
          )

          previous_end = date(
              previous_year,
              current_month,
              previous_end_day
          )


          # =================================================
          # LOAD DAILY CACHE
          # =================================================

          if os.path.exists(DAILY_FILE):

              with open(
                  DAILY_FILE,
                  "r"
              ) as file:

                  daily_data = json.load(file)

          else:

              daily_data = {
                  "locations": {}
              }


          if "locations" not in daily_data:

              daily_data["locations"] = {}


          # =================================================
          # ENSURE LOCATION STRUCTURE EXISTS
          # =================================================

          for zip_code in LOCATIONS:

              if zip_code not in daily_data["locations"]:

                  daily_data["locations"][zip_code] = {

                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"],

                      "days": {}

                  }

              elif "days" not in daily_data["locations"][zip_code]:

                  daily_data["locations"][zip_code]["days"] = {}


          # =================================================
          # VISUAL CROSSING REQUEST
          # =================================================

          total_query_cost = 0


          def get_weather(
              zip_code,
              start_date,
              end_date
          ):

              global total_query_cost


              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              print("")
              print(
                  f"Visual Crossing request:",
                  flush=True
              )

              print(
                  f"  Location: {zip_code}",
                  flush=True
              )

              print(
                  f"  Dates: {start_date} through {end_date}",
                  flush=True
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "GitHub-Actions-Monthly-Weather/1.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.loads(
                          response.read().decode()
                      )


              except urllib.error.HTTPError as error:

                  try:

                      error_body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                  except Exception:

                      error_body = (
                          "Unable to read error response."
                      )


                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  print(
                      f"Visual Crossing HTTP ERROR {error.code}",
                      flush=True
                  )

                  print(
                      f"ZIP: {zip_code}",
                      flush=True
                  )

                  print(
                      f"Date range: "
                      f"{start_date} through {end_date}",
                      flush=True
                  )

                  print(
                      error_body,
                      flush=True
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  raise RuntimeError(
                      f"Visual Crossing request failed "
                      f"with HTTP {error.code}."
                  )


              query_cost = data.get(
                  "queryCost",
                  0
              )

              total_query_cost += query_cost


              print(
                  f"  Query cost: {query_cost}",
                  flush=True
              )


              return data


          # =================================================
          # STORE DAILY RECORDS
          # =================================================

          def store_days(
              zip_code,
              data
          ):

              days = data.get(
                  "days",
                  []
              )


              for day in days:

                  weather_date = day.get(
                      "datetime"
                  )


                  if not weather_date:

                      continue


                  daily_data["locations"][
                      zip_code
                  ]["days"][weather_date] = {

                      "temp":
                          day.get("temp"),

                      "tempmax":
                          day.get("tempmax"),

                      "tempmin":
                          day.get("tempmin"),

                      "precip":
                          day.get("precip", 0) or 0

                  }


          # =================================================
          # FIND MISSING DATES
          # =================================================

          def missing_dates(
              zip_code,
              start_date,
              end_date
          ):

              existing = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]


              missing = []

              current = start_date


              while current <= end_date:

                  date_string = str(current)


                  if date_string not in existing:

                      missing.append(current)


                  current += timedelta(days=1)


              return missing


          # =================================================
          # FETCH MISSING DATA
          # =================================================
          #
          # We request missing dates in small batches.
          #
          # This keeps the initial bootstrap controlled and
          # makes the workflow's API usage easy to monitor.
          #
          # After the cache is populated, normal nightly runs
          # should only need the newest completed day.
          # =================================================

          BATCH_SIZE = 7


          for zip_code, location in LOCATIONS.items():

              print("")
              print(
                  "========================================",
                  flush=True
              )

              print(
                  f"Checking {location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}",
                  flush=True
              )

              print(
                  "========================================",
                  flush=True
              )


              # ---------------------------------------------
              # Current year missing dates
              # ---------------------------------------------

              current_missing = missing_dates(
                  zip_code,
                  current_start,
                  current_end
              )


              # ---------------------------------------------
              # Previous year missing dates
              # ---------------------------------------------

              previous_missing = missing_dates(
                  zip_code,
                  previous_start,
                  previous_end
              )


              print(
                  f"Missing current-year days: "
                  f"{len(current_missing)}",
                  flush=True
              )

              print(
                  f"Missing previous-year days: "
                  f"{len(previous_missing)}",
                  flush=True
              )


              # ---------------------------------------------
              # Process current-year missing dates
              # ---------------------------------------------

              for i in range(
                  0,
                  len(current_missing),
                  BATCH_SIZE
              ):

                  batch = current_missing[
                      i:i + BATCH_SIZE
                  ]


                  batch_start = batch[0]
                  batch_end = batch[-1]


                  data = get_weather(
                      zip_code,
                      batch_start,
                      batch_end
                  )


                  store_days(
                      zip_code,
                      data
                  )


              # ---------------------------------------------
              # Process previous-year missing dates
              # ---------------------------------------------

              for i in range(
                  0,
                  len(previous_missing),
                  BATCH_SIZE
              ):

                  batch = previous_missing[
                      i:i + BATCH_SIZE
                  ]


                  batch_start = batch[0]
                  batch_end = batch[-1]


                  data = get_weather(
                      zip_code,
                      batch_start,
                      batch_end
                  )


                  store_days(
                      zip_code,
                      data
                  )


          # =================================================
          # CALCULATE STATISTICS FROM CACHE
          # =================================================

          def calculate(
              zip_code,
              start_date,
              end_date
          ):

              days = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]


              temperatures = []
              highs = []
              lows = []
              rainfall = 0


              current = start_date


              while current <= end_date:

                  date_string = str(current)


                  if date_string not in days:

                      raise RuntimeError(
                          f"Missing cached weather data "
                          f"for {zip_code} on "
                          f"{date_string}."
                      )


                  day = days[date_string]


                  if day.get("temp") is not None:

                      temperatures.append(
                          day["temp"]
                      )


                  if day.get("tempmax") is not None:

                      highs.append(
                          day["tempmax"]
                      )


                  if day.get("tempmin") is not None:

                      lows.append(
                          day["tempmin"]
                      )


                  rainfall += (
                      day.get("precip", 0)
                      or 0
                  )


                  current += timedelta(days=1)


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # BUILD RESULTS
          # =================================================

          results = {}


          for zip_code, location in LOCATIONS.items():

              current_stats = calculate(
                  zip_code,
                  current_start,
                  current_end
              )


              previous_stats = calculate(
                  zip_code,
                  previous_start,
                  previous_end
              )


              results[zip_code] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_stats,

                  "previous":
                      previous_stats,

                  "change": {

                      "avgTemp":
                          round(
                              current_stats["avgTemp"]
                              - previous_stats["avgTemp"],
                              1
                          ),

                      "highTemp":
                          round(
                              current_stats["highTemp"]
                              - previous_stats["highTemp"],
                              1
                          ),

                      "lowTemp":
                          round(
                              current_stats["lowTemp"]
                              - previous_stats["lowTemp"],
                              1
                          ),

                      "rainfall":
                          round(
                              current_stats["rainfall"]
                              - previous_stats["rainfall"],
                              2
                          )

                  }

              }


          # =================================================
          # CREATE PHOCAS-FRIENDLY HISTORY.JSON
          # =================================================

          output = {

              "generated":
                  str(today),

              "month":
                  month_name,

              "currentYear":
                  current_year,

              "previousYear":
                  previous_year,

              "daysIncluded":
                  completed_day,

              "currentPeriod":
                  f"{current_start} through {current_end}",

              "previousPeriod":
                  f"{previous_start} through {previous_end}",

              "weather": [

                  {
                      "metric":
                          "Average Temperature",

                      "unit":
                          "°F",

                      "current": {

                          zip_code:
                              results[zip_code]["current"][
                                  "avgTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "previous": {

                          zip_code:
                              results[zip_code]["previous"][
                                  "avgTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "change": {

                          zip_code:
                              results[zip_code]["change"][
                                  "avgTemp"
                              ]

                          for zip_code in LOCATIONS

                      }

                  },


                  {
                      "metric":
                          "High Temperature",

                      "unit":
                          "°F",

                      "current": {

                          zip_code:
                              results[zip_code]["current"][
                                  "highTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "previous": {

                          zip_code:
                              results[zip_code]["previous"][
                                  "highTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "change": {

                          zip_code:
                              results[zip_code]["change"][
                                  "highTemp"
                              ]

                          for zip_code in LOCATIONS

                      }

                  },


                  {
                      "metric":
                          "Low Temperature",

                      "unit":
                          "°F",

                      "current": {

                          zip_code:
                              results[zip_code]["current"][
                                  "lowTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "previous": {

                          zip_code:
                              results[zip_code]["previous"][
                                  "lowTemp"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "change": {

                          zip_code:
                              results[zip_code]["change"][
                                  "lowTemp"
                              ]

                          for zip_code in LOCATIONS

                      }

                  },


                  {
                      "metric":
                          "Rainfall",

                      "unit":
                          "in",

                      "current": {

                          zip_code:
                              results[zip_code]["current"][
                                  "rainfall"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "previous": {

                          zip_code:
                              results[zip_code]["previous"][
                                  "rainfall"
                              ]

                          for zip_code in LOCATIONS

                      },

                      "change": {

                          zip_code:
                              results[zip_code]["change"][
                                  "rainfall"
                              ]

                          for zip_code in LOCATIONS

                      }

                  }

              ],


              "locations": [

                  {
                      "zip":
                          zip_code,

                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"]

                  }

                  for zip_code in LOCATIONS

              ]

          }


          # =================================================
          # SAVE DAILY CACHE
          # =================================================

          with open(
              DAILY_FILE,
              "w"
          ) as file:

              json.dump(
                  daily_data,
                  file,
                  indent=2
              )


          # =================================================
          # SAVE PHOCAS HISTORY
          # =================================================

          with open(
              HISTORY_FILE,
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =================================================
          # FINAL USAGE REPORT
          # =================================================

          total_cached_records = sum(

              len(
                  location["days"]
              )

              for location
              in daily_data["locations"].values()

          )


          print("")
          print(
              "========================================",
              flush=True
          )

          print(
              "WEATHER UPDATE COMPLETE",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )

          print(
              f"Comparison: "
              f"{month_name} {current_year} "
              f"vs "
              f"{month_name} {previous_year}",
              flush=True
          )

          print(
              f"Completed days: "
              f"{completed_day}",
              flush=True
          )

          print(
              f"Visual Crossing query cost this run: "
              f"{total_query_cost}",
              flush=True
          )

          print(
              f"Cached daily records: "
              f"{total_cached_records}",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )

          PY


      # =====================================================
      # COMMIT UPDATED DATA
      # =====================================================

      - name: Commit updated weather data
        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add \
            history.json \
            weather-daily.json

          git diff --cached --quiet || \
            git commit \
            -m "Update monthly historical weather"

          git push
