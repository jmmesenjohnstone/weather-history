name: Update Historical Weather

on:
schedule:
# Runs every day at 6:30 AM UTC
# This is 1:30 AM Central Standard Time
- cron: "30 6 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
update-history:
runs-on: ubuntu-latest

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Generate historical weather
    env:
      VC_API_KEY: ${{ secrets.VC_API_KEY }}
    run: |
      python3 <<'PY'

      import json
      import os
      import time
      import urllib.error
      import urllib.request
      from datetime import date, timedelta

      API_KEY = os.environ["VC_API_KEY"]

      # Retry/rate-limit settings
      MAX_RETRIES = 6
      REQUEST_DELAY = 2
      LOCATION_DELAY = 5

      LOCATIONS = {
          "63045": {
              "name": "Earth City",
              "state": "MO"
          },
          "65202": {
              "name": "Columbia",
              "state": "MO"
          },
          "42003": {
              "name": "Paducah",
              "state": "KY"
          }
      }

      today = date.today()
      yesterday = today - timedelta(days=1)

      current_year = yesterday.year
      previous_year = current_year - 1

      current_ytd_start = date(current_year, 1, 1)
      current_ytd_end = yesterday

      previous_ytd_start = date(previous_year, 1, 1)
      previous_ytd_end = date(
          previous_year,
          yesterday.month,
          yesterday.day
      )

      current_mtd_start = date(
          current_year,
          yesterday.month,
          1
      )
      current_mtd_end = yesterday

      previous_mtd_start = date(
          previous_year,
          yesterday.month,
          1
      )
      previous_mtd_end = date(
          previous_year,
          yesterday.month,
          yesterday.day
      )

      def get_weather(zip_code, start_date, end_date, max_retries=MAX_RETRIES):
          url = (
              "https://weather.visualcrossing.com/"
              "VisualCrossingWebServices/rest/services/"
              "timeline/"
              f"{zip_code}/"
              f"{start_date}/"
              f"{end_date}"
              "?unitGroup=us"
              "&include=days"
              "&elements=datetime,temp,tempmax,tempmin,precip"
              f"&key={API_KEY}"
              "&contentType=json"
          )

          print(
              f"Getting weather for {zip_code}: "
              f"{start_date} through {end_date}"
          )

          for attempt in range(max_retries):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "GitHub-Actions-Weather-Workflow/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:
                      data = json.loads(
                          response.read().decode()
                      )

                  # Slow down after successful request
                  time.sleep(REQUEST_DELAY)

                  return data

              except urllib.error.HTTPError as error:

                  # HTTP 429 = Too Many Requests
                  if error.code == 429:
                      wait_time = min(
                          60,
                          10 * (2 ** attempt)
                      )

                      print(
                          f"WARNING: Visual Crossing rate limit "
                          f"(HTTP 429) for {zip_code}."
                      )

                      print(
                          f"Waiting {wait_time} seconds before retry "
                          f"{attempt + 1}/{max_retries}..."
                      )

                      time.sleep(wait_time)
                      continue

                  # Temporary server errors
                  if error.code in (500, 502, 503, 504):
                      wait_time = min(
                          60,
                          5 * (2 ** attempt)
                      )

                      print(
                          f"WARNING: Visual Crossing returned "
                          f"HTTP {error.code}."
                      )

                      print(
                          f"Waiting {wait_time} seconds before retry "
                          f"{attempt + 1}/{max_retries}..."
                      )

                      time.sleep(wait_time)
                      continue

                  # Other HTTP errors should stop this request
                  print(
                      f"ERROR: Visual Crossing returned "
                      f"HTTP {error.code} for {zip_code}."
                  )

                  raise

              except (
                  urllib.error.URLError,
                  TimeoutError
              ) as error:

                  wait_time = min(
                      60,
                      5 * (2 ** attempt)
                  )

                  print(
                      f"WARNING: Network/timeout error "
                      f"for {zip_code}: {error}"
                  )

                  print(
                      f"Waiting {wait_time} seconds before retry "
                      f"{attempt + 1}/{max_retries}..."
                  )

                  time.sleep(wait_time)
                  continue

          raise RuntimeError(
              f"Weather request failed after {max_retries} attempts: "
              f"{zip_code} {start_date} through {end_date}"
          )

      def calculate(data):
          days = data.get("days", [])

          if not days:
              raise Exception("No weather data returned")

          temperatures = [
              d["temp"]
              for d in days
              if d.get("temp") is not None
          ]

