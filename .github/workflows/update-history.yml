name: Test Visual Crossing API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:

      - name: Test one day of weather
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta

          API_KEY = os.environ["VC_API_KEY"]

          ZIP_CODE = "63045"

          # Use yesterday — a completed day.
          test_date = date.today() - timedelta(days=1)

          url = (
              "https://weather.visualcrossing.com/"
              "VisualCrossingWebServices/rest/services/"
              "timeline/"
              f"{ZIP_CODE}/"
              f"{test_date}/"
              f"{test_date}"
              "?unitGroup=us"
              "&include=days"
              "&elements=datetime,temp,tempmax,tempmin,precip"
              f"&key={API_KEY}"
              "&contentType=json"
          )

          print("")
          print("========================================")
          print("VISUAL CROSSING API TEST")
          print("========================================")
          print(f"ZIP code: {ZIP_CODE}")
          print(f"Date:     {test_date}")
          print("Request:  ONE DAY")
          print("========================================")
          print("")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                      "GitHub-Actions-Weather-Test/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  response_body = response.read().decode()

                  data = json.loads(response_body)

                  print("")
                  print("SUCCESS!")
                  print("")
                  print("Visual Crossing accepted the request.")
                  print("")
                  print("Returned data:")
                  print(
                      json.dumps(
                          data,
                          indent=2
                      )
                  )
                  print("")
                  print("========================================")
                  print("API TEST PASSED")
                  print("========================================")

          except urllib.error.HTTPError as error:

              try:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              except Exception:
                  error_body = "Unable to read error response."

              print("")
              print("========================================")
              print(f"VISUAL CROSSING HTTP ERROR {error.code}")
              print("========================================")
              print("")
              print(error_body)
              print("")
              print("========================================")

              raise RuntimeError(
                  f"Visual Crossing API test failed "
                  f"with HTTP {error.code}."
              )

          except Exception as error:

              print("")
              print("========================================")
              print("API TEST FAILED")
              print("========================================")
              print("")
              print(str(error))
              print("")

              raise

          PY
