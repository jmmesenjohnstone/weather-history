name: Update Historical Weather

on:
  schedule:
    # Runs every day at 6:30 AM UTC
    # This is 1:30 AM Central Standard Time
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE HISTORICAL WEATHER DATA
      # =====================================================

      - name: Generate historical weather
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 <<'PY'

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]

          # Maximum number of attempts for each API request
          MAX_RETRIES = 6

          # Delay after every successful API request
          REQUEST_DELAY = 2

          # Delay between locations
          LOCATION_DELAY = 5


          LOCATIONS = {
              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }
          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # We only use completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1


          # =================================================
          # YEAR-TO-DATE DATES
          # =================================================

          current_ytd_start = date(
              current_year,
              1,
              1
          )

          current_ytd_end = yesterday


          previous_ytd_start = date(
              previous_year,
              1,
              1
          )

          previous_ytd_end = date(
              previous_year,
              yesterday.month,
              yesterday.day
          )


          # =================================================
          # MONTH-TO-DATE DATES
          # =================================================

          current_mtd_start = date(
              current_year,
              yesterday.month,
              1
          )

          current_mtd_end = yesterday


          previous_mtd_start = date(
              previous_year,
              yesterday.month,
              1
          )

          previous_mtd_end = date(
              previous_year,
              yesterday.month,
              yesterday.day
          )


          # =================================================
          # GET WEATHER FROM VISUAL CROSSING
          # =================================================

          def get_weather(
              zip_code,
              start_date,
              end_date,
              max_retries=MAX_RETRIES
          ):

              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              print(
                  f"Getting weather for {zip_code}: "
                  f"{start_date} through {end_date}"
              )


              for attempt in range(max_retries):

                  try:

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                                  "GitHub-Actions-Weather-Workflow/1.0"
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          data = json.loads(
                              response.read().decode()
                          )


                      # -------------------------------------
                      # Successful request.
                      # Wait before making another request.
                      # -------------------------------------

                      time.sleep(REQUEST_DELAY)

                      return data


                  except urllib.error.HTTPError as error:

                      # -------------------------------------
                      # HTTP 429 = Too Many Requests
                      # -------------------------------------

                      if error.code == 429:

                          wait_time = min(
                              60,
                              10 * (2 ** attempt)
                          )

                          print(
                              f"WARNING: Visual Crossing "
                              f"rate limit (HTTP 429) for "
                              f"{zip_code}."
                          )

                          print(
                              f"Waiting {wait_time} seconds "
                              f"before retry "
                              f"{attempt + 1}/{max_retries}..."
                          )

                          time.sleep(wait_time)

                          continue


                      # -------------------------------------
                      # Temporary server errors
                      # -------------------------------------

                      if error.code in (
                          500,
                          502,
                          503,
                          504
                      ):

                          wait_time = min(
                              60,
                              5 * (2 ** attempt)
                          )

                          print(
                              f"WARNING: Visual Crossing "
                              f"returned HTTP {error.code}."
                          )

                          print(
                              f"Waiting {wait_time} seconds "
                              f"before retry "
                              f"{attempt + 1}/{max_retries}..."
                          )

                          time.sleep(wait_time)

                          continue


                      # -------------------------------------
                      # Other HTTP errors
                      # -------------------------------------

                      print(
                          f"ERROR: Visual Crossing returned "
                          f"HTTP {error.code} for {zip_code}."
                      )

                      raise


                  except (
                      urllib.error.URLError,
                      TimeoutError
                  ) as error:

                      # -------------------------------------
                      # Network or timeout error
                      # -------------------------------------

                      wait_time = min(
                          60,
                          5 * (2 ** attempt)
                      )

                      print(
                          f"WARNING: Network/timeout error "
                          f"for {zip_code}: {error}"
                      )

                      print(
                          f"Waiting {wait_time} seconds "
                          f"before retry "
                          f"{attempt + 1}/{max_retries}..."
                      )

                      time.sleep(wait_time)

                      continue


              # ---------------------------------------------
              # All retries exhausted
              # ---------------------------------------------

              raise RuntimeError(
                  f"Weather request failed after "
                  f"{max_retries} attempts: "
                  f"{zip_code} "
                  f"{start_date} through {end_date}"
              )


          # =================================================
          # CALCULATE WEATHER STATISTICS
          # =================================================

          def calculate(data):

              days = data.get(
                  "days",
                  []
              )


              if not days:

                  raise Exception(
                      "No weather data returned"
                  )


              temperatures = [

                  d["temp"]

                  for d in days

                  if d.get("temp") is not None

              ]


              highs = [

                  d["tempmax"]

                  for d in days

                  if d.get("tempmax") is not None

              ]


              lows = [

                  d["tempmin"]

                  for d in days

                  if d.get("tempmin") is not None

              ]


              rainfall = sum(

                  d.get(
                      "precip",
                      0
                  ) or 0

                  for d in days

              )


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # CREATE OUTPUT STRUCTURE
          # =================================================

          month_name = yesterday.strftime("%B")


          output = {

              "generated":
                  str(today),


              "ytd": {

                  "currentYear":
                      current_year,

                  "previousYear":
                      previous_year,

                  "locations": {}

              },


              "mtd": {

                  "currentLabel":
                      f"{month_name} {current_year}",

                  "previousLabel":
                      f"{month_name} {previous_year}",

                  "locations": {}

              }

          }


          # =================================================
          # PROCESS ALL THREE LOCATIONS
          # =================================================

          for location_index, (zip_code, location) in enumerate(
              LOCATIONS.items()
          ):


              print("")
              print(
                  "========================================"
              )

              print(
                  f"Processing "
                  f"{location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}"
              )

              print(
                  "========================================"
              )


              try:

                  # -----------------------------------------
                  # CURRENT YTD
                  # -----------------------------------------

                  current_ytd_data = get_weather(

                      zip_code,

                      current_ytd_start,

                      current_ytd_end

                  )


                  # -----------------------------------------
                  # PREVIOUS YTD
                  # -----------------------------------------

                  previous_ytd_data = get_weather(

                      zip_code,

                      previous_ytd_start,

                      previous_ytd_end

                  )


                  # -----------------------------------------
                  # CURRENT MONTH
                  # -----------------------------------------

                  current_mtd_data = get_weather(

                      zip_code,

                      current_mtd_start,

                      current_mtd_end

                  )


                  # -----------------------------------------
                  # PREVIOUS MONTH
                  # -----------------------------------------

                  previous_mtd_data = get_weather(

                      zip_code,

                      previous_mtd_start,

                      previous_mtd_end

                  )


                  # -----------------------------------------
                  # CALCULATE RESULTS
                  # -----------------------------------------

                  current_ytd = calculate(
                      current_ytd_data
                  )

                  previous_ytd = calculate(
                      previous_ytd_data
                  )

                  current_mtd = calculate(
                      current_mtd_data
                  )

                  previous_mtd = calculate(
                      previous_mtd_data
                  )


                  # -----------------------------------------
                  # SAVE YTD RESULTS
                  # -----------------------------------------

                  output["ytd"]["locations"][
                      zip_code
                  ] = {

                      "name":
                          location["name"],

                      "state":
                          location["state"],

                      "current":
                          current_ytd,

                      "previous":
                          previous_ytd

                  }


                  # -----------------------------------------
                  # SAVE MONTHLY RESULTS
                  # -----------------------------------------

                  output["mtd"]["locations"][
                      zip_code
                  ] = {

                      "name":
                          location["name"],

                      "state":
                          location["state"],

                      "current":
                          current_mtd,

                      "previous":
                          previous_mtd

                  }


                  print("")
                  print(
                      f"Successfully processed "
                      f"{location['name']}, "
                      f"{location['state']} "
                      f"{zip_code}"
                  )


              except Exception as error:

                  # -----------------------------------------
                  # If one location fails after all retries,
                  # continue with the next location.
                  # -----------------------------------------

                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )

                  print(
                      f"ERROR processing "
                      f"{location['name']}, "
                      f"{location['state']} "
                      f"{zip_code}"
                  )

                  print(
                      f"Error: {error}"
                  )

                  print(
                      "Skipping this location and "
                      "continuing with the next location."
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )

                  continue


              # ---------------------------------------------
              # Wait before processing the next location.
              # ---------------------------------------------

              if location_index < len(LOCATIONS) - 1:

                  print("")

                  print(
                      f"Waiting {LOCATION_DELAY} seconds "
                      "before next location..."
                  )

                  time.sleep(LOCATION_DELAY)


          # =================================================
          # WRITE HISTORY.JSON
          # =================================================

          with open(
              "history.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print("")
          print(
              "========================================"
          )

          print(
              "Historical weather data created "
              "successfully."
          )

          print(
              "========================================"
          )

          PY


      # =====================================================
      # COMMIT UPDATED HISTORY.JSON
      # =====================================================

      - name: Commit updated history
        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add history.json

          git diff --cached --quiet || \
            git commit \
            -m "Update historical weather"

          git push
