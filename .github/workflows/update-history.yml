name: Update Historical Weather

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 11:50 PM UTC
    - cron: "50 23 * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE WEATHER DATA
      # =====================================================

      - name: Update weather data
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]


          LOCATIONS = {

              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "62234": {
                  "name": "Collinsville",
                  "state": "IL"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }

          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # Only use completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1

          current_month = yesterday.month


          current_start = date(
              current_year,
              current_month,
              1
          )


          previous_start = date(
              previous_year,
              current_month,
              1
          )


          current_end = yesterday


          previous_end = date(
              previous_year,
              yesterday.month,
              yesterday.day
          )


          # =================================================
          # LOAD EXISTING DAILY CACHE
          # =================================================

          cache_file = "weather-daily.json"


          if os.path.exists(cache_file):

              with open(
                  cache_file,
                  "r"
              ) as file:

                  cache = json.load(file)

          else:

              cache = {}


          # Make sure every location has a cache.
          for zip_code in LOCATIONS:

              if zip_code not in cache:

                  cache[zip_code] = {}


          # =================================================
          # GET WEATHER FROM VISUAL CROSSING
          # =================================================

          def get_weather(
              zip_code,
              start_date,
              end_date
          ):

              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              query_cost = (
                  end_date - start_date
              ).days + 1


              print("")
              print(
                  "Visual Crossing request:"
              )

              print(
                  f"  Location: {zip_code}"
              )

              print(
                  f"  Dates: "
                  f"{start_date} through {end_date}"
              )

              print(
                  f"  Query cost: {query_cost}"
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "GitHub-Actions-Weather-Workflow/1.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      return json.loads(
                          response.read().decode()
                      )


              except urllib.error.HTTPError as error:

                  try:

                      error_body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                  except Exception:

                      error_body = (
                          "Unable to read error response."
                      )


                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )

                  print(
                      f"Visual Crossing HTTP ERROR "
                      f"{error.code}"
                  )

                  print(
                      error_body
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                  )

                  raise


          # =================================================
          # ADD DATA TO CACHE
          # =================================================

          total_query_cost = 0


          def update_cache(
              zip_code,
              start_date,
              end_date,
              label
          ):

              global total_query_cost


              missing = []


              current = start_date


              while current <= end_date:

                  key = str(current)


                  if key not in cache[zip_code]:

                      missing.append(
                          current
                      )


                  current += timedelta(days=1)


              location = LOCATIONS[zip_code]


              print("")
              print(
                  "========================================"
              )

              print(
                  f"Checking "
                  f"{location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}"
              )

              print(
                  "========================================"
              )

              print(
                  f"Missing {label} days: "
                  f"{len(missing)}"
              )


              # Nothing new to download.
              if not missing:

                  return


              # ---------------------------------------------
              # Download missing dates in groups of 7 days.
              # ---------------------------------------------

              group_start = missing[0]

              previous = missing[0]


              for current in missing[1:]:

                  # A gap means the previous group is complete.
                  if (
                      current - previous
                  ).days > 1:

                      data = get_weather(
                          zip_code,
                          group_start,
                          previous
                      )


                      days = data.get(
                          "days",
                          []
                      )


                      total_query_cost += len(days)


                      for day in days:

                          cache[
                              zip_code
                          ][
                              day["datetime"]
                          ] = {

                              "temp":
                                  day.get("temp"),

                              "tempmax":
                                  day.get("tempmax"),

                              "tempmin":
                                  day.get("tempmin"),

                              "precip":
                                  day.get(
                                      "precip",
                                      0
                                  ) or 0
                          }


                      group_start = current


                  # Maximum group size = 7 days.
                  elif (
                      (current - group_start).days >= 6
                  ):

                      data = get_weather(
                          zip_code,
                          group_start,
                          current
                      )


                      days = data.get(
                          "days",
                          []
                      )


                      total_query_cost += len(days)


                      for day in days:

                          cache[
                              zip_code
                          ][
                              day["datetime"]
                          ] = {

                              "temp":
                                  day.get("temp"),

                              "tempmax":
                                  day.get("tempmax"),

                              "tempmin":
                                  day.get("tempmin"),

                              "precip":
                                  day.get(
                                      "precip",
                                      0
                                  ) or 0
                          }


                      group_start = (
                          current +
                          timedelta(days=1)
                      )


                  previous = current


              # ---------------------------------------------
              # Download remaining group.
              # ---------------------------------------------

              if group_start <= previous:

                  data = get_weather(
                      zip_code,
                      group_start,
                      previous
                  )


                  days = data.get(
                      "days",
                      []
                  )


                  total_query_cost += len(days)


                  for day in days:

                      cache[
                          zip_code
                      ][
                          day["datetime"]
                      ] = {

                          "temp":
                              day.get("temp"),

                          "tempmax":
                              day.get("tempmax"),

                          "tempmin":
                              day.get("tempmin"),

                          "precip":
                              day.get(
                                  "precip",
                                  0
                              ) or 0
                      }


          # =================================================
          # UPDATE ALL LOCATIONS
          # =================================================

          for zip_code in LOCATIONS:

              # Current month this year.
              update_cache(
                  zip_code,
                  current_start,
                  current_end,
                  "current-year"
              )


              # Same month last year.
              update_cache(
                  zip_code,
                  previous_start,
                  previous_end,
                  "previous-year"
              )


          # =================================================
          # SAVE DAILY CACHE
          # =================================================

          with open(
              cache_file,
              "w"
          ) as file:

              json.dump(
                  cache,
                  file,
                  indent=2
              )


          # =================================================
          # CALCULATE STATISTICS
          # =================================================

          def calculate(
              zip_code,
              start_date,
              end_date
          ):

              days = []


              current = start_date


              while current <= end_date:

                  key = str(current)


                  if key in cache[zip_code]:

                      days.append(
                          cache[zip_code][key]
                      )


                  current += timedelta(days=1)


              temperatures = [

                  d["temp"]

                  for d in days

                  if d.get("temp") is not None

              ]


              highs = [

                  d["tempmax"]

                  for d in days

                  if d.get("tempmax") is not None

              ]


              lows = [

                  d["tempmin"]

                  for d in days

                  if d.get("tempmin") is not None

              ]


              rainfall = sum(

                  d.get(
                      "precip",
                      0
                  ) or 0

                  for d in days

              )


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # BUILD HISTORY.JSON
          # =================================================

          month_name = yesterday.strftime(
              "%B"
          )


          history = {

              "generated":
                  str(today),


              "month":
                  month_name,


              "currentYear":
                  current_year,


              "previousYear":
                  previous_year,


              "daysIncluded":
                  (
                      current_end -
                      current_start
                  ).days + 1,


              "currentPeriod":
                  (
                      f"{current_start} "
                      f"through "
                      f"{current_end}"
                  ),


              "previousPeriod":
                  (
                      f"{previous_start} "
                      f"through "
                      f"{previous_end}"
                  ),


              "weather": [],


              "locations": []

          }


          # =================================================
          # METRICS
          # =================================================

          metric_definitions = [

              (
                  "Average Temperature",
                  "°F",
                  "avgTemp"
              ),

              (
                  "High Temperature",
                  "°F",
                  "highTemp"
              ),

              (
                  "Low Temperature",
                  "°F",
                  "lowTemp"
              ),

              (
                  "Rainfall",
                  "in",
                  "rainfall"
              )

          ]


          results = {}


          # =================================================
          # CALCULATE EACH LOCATION
          # =================================================

          for zip_code, location in LOCATIONS.items():

              results[zip_code] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      calculate(
                          zip_code,
                          current_start,
                          current_end
                      ),

                  "previous":
                      calculate(
                          zip_code,
                          previous_start,
                          previous_end
                      )

              }


          # =================================================
          # BUILD WEATHER METRICS
          # =================================================

          for metric_name, unit, key in metric_definitions:

              current_values = {}

              previous_values = {}

              changes = {}


              for zip_code in LOCATIONS:

                  current_value = results[
                      zip_code
                  ][
                      "current"
                  ][
                      key
                  ]


                  previous_value = results[
                      zip_code
                  ][
                      "previous"
                  ][
                      key
                  ]


                  current_values[
                      zip_code
                  ] = current_value


                  previous_values[
                      zip_code
                  ] = previous_value


                  if (
                      current_value is not None
                      and
                      previous_value is not None
                  ):

                      changes[
                          zip_code
                      ] = round(
                          current_value -
                          previous_value,
                          2
                      )

                  else:

                      changes[
                          zip_code
                      ] = None


              history["weather"].append({

                  "metric":
                      metric_name,

                  "unit":
                      unit,

                  "current":
                      current_values,

                  "previous":
                      previous_values,

                  "change":
                      changes

              })


          # =================================================
          # LOCATION LIST
          # =================================================

          for zip_code, location in LOCATIONS.items():

              history["locations"].append({

                  "zip":
                      zip_code,

                  "name":
                      location["name"],

                  "state":
                      location["state"]

              })


          # =================================================
          # SAFETY CHECK
          # =================================================

          if not history["weather"]:

              raise RuntimeError(
                  "No weather data generated."
              )


          if not history["locations"]:

              raise RuntimeError(
                  "No locations were generated."
              )


          # =================================================
          # WRITE HISTORY.JSON
          # =================================================

          with open(
              "history.json",
              "w"
          ) as file:

              json.dump(
                  history,
                  file,
                  indent=2
              )


          # =================================================
          # SUMMARY
          # =================================================

          cached_records = sum(

              len(records)

              for records in cache.values()

          )


          print("")
          print(
              "========================================"
          )

          print(
              "WEATHER UPDATE COMPLETE"
          )

          print(
              "========================================"
          )

          print(
              f"Comparison: "
              f"{month_name} "
              f"{current_year} "
              f"vs "
              f"{month_name} "
              f"{previous_year}"
          )

          print(
              f"Completed days: "
              f"{history['daysIncluded']}"
          )

          print(
              f"Visual Crossing query cost "
              f"this run: "
              f"{total_query_cost}"
          )

          print(
              f"Cached daily records: "
              f"{cached_records}"
          )

          print(
              "Generated:"
          )

          print(
              "  - weather-daily.json"
          )

          print(
              "  - history.json"
          )

          print(
              "========================================"
          )

          PY


      # =====================================================
      # COMMIT DATA
      # =====================================================

      - name: Commit updated weather data
        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add weather-daily.json
          git add history.json

          git diff --cached --quiet || \
            git commit \
            -m "Update historical weather"

          git push
