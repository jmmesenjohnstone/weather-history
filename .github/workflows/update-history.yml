name: Update Monthly Historical Weather

on:
  # Run manually for now.
  # Once everything is verified, we can add the daily schedule back.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE MONTHLY WEATHER DATA
      # =====================================================

      - name: Generate monthly weather
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]


          LOCATIONS = {
              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }
          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # Only use completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1

          current_month = yesterday.month

          month_name = yesterday.strftime("%B")


          # Current month:
          # Example:
          # August 1, 2026 -> August 30, 2026

          current_start = date(
              current_year,
              current_month,
              1
          )

          current_end = yesterday


          # Same month last year:
          # Example:
          # August 1, 2025 -> August 30, 2025

          previous_start = date(
              previous_year,
              current_month,
              1
          )

          previous_end = date(
              previous_year,
              current_month,
              yesterday.day
          )


          # =================================================
          # VISUAL CROSSING API
          # =================================================

          def get_weather(
              zip_code,
              start_date,
              end_date
          ):

              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              print(
                  f"Getting weather for {zip_code}: "
                  f"{start_date} through {end_date}",
                  flush=True
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "GitHub-Actions-Monthly-Weather/1.0"
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.loads(
                          response.read().decode()
                      )


                      print(
                          f"Request successful for {zip_code}.",
                          flush=True
                      )


                      return data


              except urllib.error.HTTPError as error:

                  try:

                      error_body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                  except Exception:

                      error_body = (
                          "Unable to read error response."
                      )


                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  print(
                      f"Visual Crossing HTTP ERROR {error.code}",
                      flush=True
                  )

                  print(
                      f"ZIP: {zip_code}",
                      flush=True
                  )

                  print(
                      f"Date range: "
                      f"{start_date} through {end_date}",
                      flush=True
                  )

                  print(
                      "Visual Crossing response:",
                      flush=True
                  )

                  print(
                      error_body,
                      flush=True
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )


                  raise RuntimeError(
                      f"Visual Crossing request failed "
                      f"with HTTP {error.code}."
                  )


          # =================================================
          # CALCULATE WEATHER STATISTICS
          # =================================================

          def calculate(data):

              days = data.get(
                  "days",
                  []
              )


              if not days:

                  raise RuntimeError(
                      "No weather data returned."
                  )


              temperatures = [

                  d["temp"]

                  for d in days

                  if d.get("temp") is not None

              ]


              highs = [

                  d["tempmax"]

                  for d in days

                  if d.get("tempmax") is not None

              ]


              lows = [

                  d["tempmin"]

                  for d in days

                  if d.get("tempmin") is not None

              ]


              rainfall = sum(

                  d.get(
                      "precip",
                      0
                  ) or 0

                  for d in days

              )


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # CREATE OUTPUT
          # =================================================

          output = {

              "generated":
                  str(today),

              "month":
                  month_name,

              "currentYear":
                  current_year,

              "previousYear":
                  previous_year,

              "currentPeriod":
                  f"{current_start} through {current_end}",

              "previousPeriod":
                  f"{previous_start} through {previous_end}",

              "locations": {}

          }


          # =================================================
          # PROCESS LOCATIONS
          # =================================================

          for zip_code, location in LOCATIONS.items():

              print("")
              print(
                  "========================================",
                  flush=True
              )

              print(
                  f"Processing "
                  f"{location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}",
                  flush=True
              )

              print(
                  "========================================",
                  flush=True
              )


              # ---------------------------------------------
              # CURRENT YEAR
              # ---------------------------------------------

              current_data = get_weather(

                  zip_code,

                  current_start,

                  current_end

              )


              # ---------------------------------------------
              # PREVIOUS YEAR
              # ---------------------------------------------

              previous_data = get_weather(

                  zip_code,

                  previous_start,

                  previous_end

              )


              # ---------------------------------------------
              # CALCULATE
              # ---------------------------------------------

              current_stats = calculate(
                  current_data
              )

              previous_stats = calculate(
                  previous_data
              )


              # ---------------------------------------------
              # SAVE
              # ---------------------------------------------

              output["locations"][
                  zip_code
              ] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_stats,

                  "previous":
                      previous_stats

              }


              print("")
              print(
                  f"Successfully processed "
                  f"{location['name']}, "
                  f"{location['state']}.",
                  flush=True
              )


          # =================================================
          # SAFETY CHECK
          # =================================================

          if len(output["locations"]) != len(LOCATIONS):

              raise RuntimeError(
                  "Not all locations were successfully "
                  "processed. history.json will NOT be "
                  "overwritten."
              )


          # =================================================
          # WRITE HISTORY.JSON
          # =================================================

          with open(
              "history.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print("")
          print(
              "========================================",
              flush=True
          )

          print(
              "Monthly historical weather data "
              "created successfully.",
              flush=True
          )

          print(
              f"Comparison: "
              f"{month_name} {current_year} "
              f"vs "
              f"{month_name} {previous_year}",
              flush=True
          )

          print(
              f"Locations processed: "
              f"{len(output['locations'])}",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )

          PY


      # =====================================================
      # COMMIT UPDATED HISTORY.JSON
      # =====================================================

      - name: Commit updated history
        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add history.json

          git diff --cached --quiet || \
            git commit \
            -m "Update monthly historical weather"

          git push
