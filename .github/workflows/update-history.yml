name: Update Historical Weather

on:
schedule:
# Runs every day at 6:30 AM UTC
# This is 1:30 AM Central Standard Time
- cron: "30 6 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
update-history:
runs-on: ubuntu-latest

steps:

  # =====================================================
  # CHECK OUT REPOSITORY
  # =====================================================

  - name: Check out repository
    uses: actions/checkout@v4


  # =====================================================
  # GENERATE HISTORICAL WEATHER DATA
  # =====================================================

  - name: Generate historical weather
    env:
      VC_API_KEY: ${{ secrets.VC_API_KEY }}

    run: |
      python3 -u <<'PY'

      import json
      import os
      import urllib.error
      import urllib.request
      from datetime import date, timedelta


      # =================================================
      # SETTINGS
      # =================================================

      API_KEY = os.environ["VC_API_KEY"]


      LOCATIONS = {
          "63045": {
              "name": "Earth City",
              "state": "MO"
          },

          "65202": {
              "name": "Columbia",
              "state": "MO"
          },

          "42003": {
              "name": "Paducah",
              "state": "KY"
          }
      }


      # =================================================
      # DATES
      # =================================================

      today = date.today()

      # We only use completed days.
      yesterday = today - timedelta(days=1)

      current_year = yesterday.year
      previous_year = current_year - 1


      # =================================================
      # YEAR-TO-DATE DATES
      # =================================================

      current_ytd_start = date(
          current_year,
          1,
          1
      )

      current_ytd_end = yesterday


      previous_ytd_start = date(
          previous_year,
          1,
          1
      )

      previous_ytd_end = date(
          previous_year,
          yesterday.month,
          yesterday.day
      )


      # =================================================
      # MONTH-TO-DATE DATES
      # =================================================

      current_mtd_start = date(
          current_year,
          yesterday.month,
          1
      )

      current_mtd_end = yesterday


      previous_mtd_start = date(
          previous_year,
          yesterday.month,
          1
      )

      previous_mtd_end = date(
          previous_year,
          yesterday.month,
          yesterday.day
      )


      # =================================================
      # GET WEATHER FROM VISUAL CROSSING
      # =================================================

      def get_weather(
          zip_code,
          start_date,
          end_date
      ):

          url = (
              "https://weather.visualcrossing.com/"
              "VisualCrossingWebServices/rest/services/"
              "timeline/"
              f"{zip_code}/"
              f"{start_date}/"
              f"{end_date}"
              "?unitGroup=us"
              "&include=days"
              "&elements="
              "datetime,temp,tempmax,tempmin,precip"
              f"&key={API_KEY}"
              "&contentType=json"
          )


          print(
              f"Getting weather for {zip_code}: "
              f"{start_date} through {end_date}",
              flush=True
          )


          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                      "GitHub-Actions-Weather-Workflow/1.0"
              }
          )


          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  data = json.loads(
                      response.read().decode()
                  )

                  print(
                      f"Weather request successful for "
                      f"{zip_code}.",
                      flush=True
                  )

                  return data


          except urllib.error.HTTPError as error:

              # -----------------------------------------
              # IMPORTANT:
              # Visual Crossing says the response body
              # normally contains the actual reason for
              # a 429 error.
              # -----------------------------------------

              try:

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

              except Exception:

                  error_body = (
                      "Unable to read error response."
                  )


              print("")
              print(
                  "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                  flush=True
              )

              print(
                  f"Visual Crossing HTTP ERROR {error.code}",
                  flush=True
              )

              print(
                  f"ZIP: {zip_code}",
                  flush=True
              )

              print(
                  f"Date range: "
                  f"{start_date} through {end_date}",
                  flush=True
              )

              print(
                  "Visual Crossing response:",
                  flush=True
              )

              print(
                  error_body,
                  flush=True
              )

              print(
                  "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                  flush=True
              )


              # -----------------------------------------
              # Do NOT retry 429 during this diagnostic
              # run. We need to see the actual response.
              # -----------------------------------------

              if error.code == 429:

                  raise RuntimeError(
                      "Visual Crossing returned HTTP 429. "
                      "See the response above for the "
                      "specific account/usage limit."
                  )


              raise


      # =================================================
      # CALCULATE WEATHER STATISTICS
      # =================================================

      def calculate(data):

          days = data.get(
              "days",
              []
          )


          if not days:

              raise Exception(
                  "No weather data returned"
              )


          temperatures = [

              d["temp"]

              for d in days

              if d.get("temp") is not None

          ]


          highs = [

              d["tempmax"]

              for d in days

              if d.get("tempmax") is not None

          ]


          lows = [

              d["tempmin"]

              for d in days

              if d.get("tempmin") is not None

          ]


          rainfall = sum(

              d.get(
                  "precip",
                  0
              ) or 0

              for d in days

          )


          return {

              "avgTemp":
                  round(
                      sum(temperatures)
                      / len(temperatures),
                      1
                  )
                  if temperatures
                  else None,


              "highTemp":
                  max(highs)
                  if highs
                  else None,


              "lowTemp":
                  min(lows)
                  if lows
                  else None,


              "rainfall":
                  round(
                      rainfall,
                      2
                  )

          }


      # =================================================
      # CREATE OUTPUT STRUCTURE
      # =================================================

      month_name = yesterday.strftime("%B")


      output = {

          "generated":
              str(today),


          "ytd": {

              "currentYear":
                  current_year,

              "previousYear":
                  previous_year,

              "locations": {}

          },


          "mtd": {

              "currentLabel":
                  f"{month_name} {current_year}",

              "previousLabel":
                  f"{month_name} {previous_year}",

              "locations": {}

          }

      }


      # =================================================
      # PROCESS ALL THREE LOCATIONS
      # =================================================

      for zip_code, location in LOCATIONS.items():

          print("")
          print(
              "========================================",
              flush=True
          )

          print(
              f"Processing "
              f"{location['name']}, "
              f"{location['state']} "
              f"{zip_code}",
              flush=True
          )

          print(
              "========================================",
              flush=True
          )


          # ---------------------------------------------
          # CURRENT YTD
          # ---------------------------------------------

          current_ytd_data = get_weather(

              zip_code,

              current_ytd_start,

              current_ytd_end

          )


          # ---------------------------------------------
          # PREVIOUS YTD
          # ---------------------------------------------

          previous_ytd_data = get_weather(

              zip_code,

              previous_ytd_start,

              previous_ytd_end

          )


          # ---------------------------------------------
          # CURRENT MONTH
          # ---------------------------------------------

          current_mtd_data = get_weather(

              zip_code,

              current_mtd_start,

              current_mtd_end

          )


          # ---------------------------------------------
          # PREVIOUS MONTH
          # ---------------------------------------------

          previous_mtd_data = get_weather(

              zip_code,

              previous_mtd_start,

              previous_mtd_end

          )


          # ---------------------------------------------
          # CALCULATE RESULTS
          # ---------------------------------------------

          current_ytd = calculate(
              current_ytd_data
          )

          previous_ytd = calculate(
              previous_ytd_data
          )

          current_mtd = calculate(
              current_mtd_data
          )

          previous_mtd = calculate(
              previous_mtd_data
          )


          # ---------------------------------------------
          # SAVE YTD RESULTS
          # ---------------------------------------------

          output["ytd"]["locations"][
              zip_code
          ] = {

              "name":
                  location["name"],

              "state":
                  location["state"],

              "current":
                  current_ytd,

              "previous":
                  previous_ytd

          }


          # ---------------------------------------------
          # SAVE MONTHLY RESULTS
          # ---------------------------------------------

          output["mtd"]["locations"][
              zip_code
          ] = {

              "name":
                  location["name"],

              "state":
                  location["state"],

              "current":
                  current_mtd,

              "previous":
                  previous_mtd

          }


          print("")
          print(
              f"Successfully processed "
              f"{location['name']}, "
              f"{location['state']} "
              f"{zip_code}",
              flush=True
          )


      # =================================================
      # SAFETY CHECK
      # =================================================

      # Never overwrite history.json with an empty
      # locations object.

      if not output["ytd"]["locations"]:

          raise RuntimeError(
              "No locations were successfully processed. "
              "history.json will NOT be overwritten."
          )


      if not output["mtd"]["locations"]:

          raise RuntimeError(
              "No monthly locations were successfully "
              "processed. history.json will NOT be "
              "overwritten."
          )


      # =================================================
      # WRITE HISTORY.JSON
      # =================================================

      with open(
          "history.json",
          "w"
      ) as file:

          json.dump(
              output,
              file,
              indent=2
          )


      print("")
      print(
          "========================================",
          flush=True
      )

      print(
          "Historical weather data created "
          "successfully.",
          flush=True
      )

      print(
          f"Locations processed: "
          f"{len(output['ytd']['locations'])}",
          flush=True
      )

      print(
          "========================================",
          flush=True
      )

      PY


  # =====================================================
  # COMMIT UPDATED HISTORY.JSON
  # =====================================================

  - name: Commit updated history
    run: |

      git config user.name \
        "GitHub Actions"

      git config user.email \
        "actions@github.com"

      git add history.json

      git diff --cached --quiet || \
        git commit \
        -m "Update historical weather"

      git push
