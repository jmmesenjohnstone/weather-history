name: Update Historical Weather

on:
  schedule:
    # Runs every day at 1:30 AM Central Time
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Get the repository
      # ---------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # Generate historical weather data
      # ---------------------------------------------------

      - name: Generate historical weather
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |

          python3 <<'PY'

          import json
          import os
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]


          LOCATIONS = {

              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },

              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },

              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }

          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()

          # Always compare completed days.
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year

          previous_year = current_year - 1


          # =================================================
          # DATE RANGES
          # =================================================

          # Current YTD

          current_ytd_start = date(
              current_year,
              1,
              1
          )

          current_ytd_end = yesterday


          # Previous YTD

          previous_ytd_start = date(
              previous_year,
              1,
              1
          )

          previous_ytd_end = date(
              previous_year,
              yesterday.month,
              yesterday.day
          )


          # Current month-to-date

          current_mtd_start = date(
              current_year,
              yesterday.month,
              1
          )

          current_mtd_end = yesterday


          # Previous-year same period

          previous_mtd_start = date(
              previous_year,
              yesterday.month,
              1
          )

          previous_mtd_end = date(
              previous_year,
              yesterday.month,
              yesterday.day
          )


          # =================================================
          # VISUAL CROSSING REQUEST
          # =================================================

          def get_weather(zip_code, start_date, end_date):

              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/{start_date}/{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )


              print(
                  f"Getting {zip_code}: "
                  f"{start_date} through {end_date}"
              )


              request = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "GitHub-Actions"
                  }

              )


              with urllib.request.urlopen(
                  request
              ) as response:

                  return json.loads(
                      response
                      .read()
                      .decode()
                  )


          # =================================================
          # CALCULATE STATISTICS
          # =================================================

          def calculate(data):

              days = data.get(
                  "days",
                  []
              )


              if not days:

                  raise Exception(
                      "No weather data returned"
                  )


              temperatures = [

                  d["temp"]

                  for d in days

                  if d.get("temp") is not None

              ]


              highs = [

                  d["tempmax"]

                  for d in days

                  if d.get("tempmax") is not None

              ]


              lows = [

                  d["tempmin"]

                  for d in days

                  if d.get("tempmin") is not None

              ]


              rainfall = sum(

                  d.get(
                      "precip",
                      0
                  ) or 0

                  for d in days

              )


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      )
                      if temperatures
                      else None,


                  "highTemp":
                      max(highs)
                      if highs
                      else None,


                  "lowTemp":
                      min(lows)
                      if lows
                      else None,


                  "rainfall":
                      round(
                          rainfall,
                          2
                      )

              }


          # =================================================
          # OUTPUT STRUCTURE
          # =================================================

          output = {

              "generated":
                  str(today),


              "ytd": {

                  "currentYear":
                      current_year,

                  "previousYear":
                      previous_year,

                  "locations": {}

              },


              "mtd": {

                  "currentLabel":
                      yesterday.strftime(
                          "%B %Y"
                      ),

                  "previousLabel":
                      yesterday.strftime(
                          "%B "
                      )
                      +
                      str(previous_year),

                  "locations": {}

              }

          }


          # =================================================
          # PROCESS EACH ZIP CODE
          # =================================================

          for zip_code, location in LOCATIONS.items():

              print(
                  ""
              )

              print(
                  "================================="
              )

              print(
                  f"Processing "
                  f"{location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}"
              )

              print(
                  "================================="
              )


              # ---------------------------------------------
              # Current YTD
              # ---------------------------------------------

              current_ytd_data = get_weather(

                  zip_code,

                  current_ytd_start,

                  current_ytd_end

              )


              # ---------------------------------------------
              # Previous YTD
              # ---------------------------------------------

              previous_ytd_data = get_weather(

                  zip_code,

                  previous_ytd_start,

                  previous_ytd_end

              )


              # ---------------------------------------------
              # Current Month
              # ---------------------------------------------

              current_mtd_data = get_weather(

                  zip_code,

                  current_mtd_start,

                  current_mtd_end

              )


              # ---------------------------------------------
              # Previous Month
              # ---------------------------------------------

              previous_mtd_data = get_weather(

                  zip_code,

                  previous_mtd_start,

                  previous_mtd_end

              )


              # ---------------------------------------------
              # Calculate
              # ---------------------------------------------

              current_ytd =
                  calculate(
                      current_ytd_data
                  )


              previous_ytd =
                  calculate(
                      previous_ytd_data
                  )


              current_mtd =
                  calculate(
                      current_mtd_data
                  )


              previous_mtd =
                  calculate(
                      previous_mtd_data
                  )


              # ---------------------------------------------
              # Store YTD
              # ---------------------------------------------

              output["ytd"]["locations"][
                  zip_code
              ] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_ytd,

                  "previous":
                      previous_ytd

              }


              # ---------------------------------------------
              # Store MTD
              # ---------------------------------------------

              output["mtd"]["locations"][
                  zip_code
              ] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_mtd,

                  "previous":
                      previous_mtd

              }


          # =================================================
          # WRITE JSON FILE
          # =================================================

          with open(
              "history.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print("")
          print("=================================")
          print("Historical weather data created.")
          print("=================================")

          PY


      # ---------------------------------------------------
      # Save history.json
      # ---------------------------------------------------

      - name: Commit updated history

        run: |

          git config user.name \
            "GitHub Actions"

          git config user.email \
            "actions@github.com"

          git add history.json

          git diff --cached --quiet || \
            git commit \
            -m "Update historical weather"

          git push
