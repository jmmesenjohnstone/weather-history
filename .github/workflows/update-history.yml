name: Update Monthly Historical Weather

on:
  schedule:
    - cron: "50 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECK OUT REPOSITORY
      # =====================================================

      - name: Check out repository
        uses: actions/checkout@v4


      # =====================================================
      # GENERATE WEATHER DATA + GITHUB PAGES DASHBOARD
      # =====================================================

      - name: Update weather data
        env:
          VC_API_KEY: ${{ secrets.VC_API_KEY }}

        run: |
          python3 -u <<'PY'

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import date, timedelta


          # =================================================
          # SETTINGS
          # =================================================

          API_KEY = os.environ["VC_API_KEY"]

          DAILY_FILE = "weather-daily.json"
          HISTORY_FILE = "history.json"
          README_FILE = "README.md"
          HTML_FILE = "index.html"

          LOCATIONS = {
              "63045": {
                  "name": "Earth City",
                  "state": "MO"
              },
              "65202": {
                  "name": "Columbia",
                  "state": "MO"
              },
              "42003": {
                  "name": "Paducah",
                  "state": "KY"
              }
          }


          # =================================================
          # DATES
          # =================================================

          today = date.today()
          yesterday = today - timedelta(days=1)

          current_year = yesterday.year
          previous_year = current_year - 1
          current_month = yesterday.month
          completed_day = yesterday.day

          month_name = yesterday.strftime("%B")


          # =================================================
          # LAST DAY OF MONTH
          # =================================================

          def last_day_of_month(year, month):

              if month == 12:
                  next_month = date(year + 1, 1, 1)
              else:
                  next_month = date(year, month + 1, 1)

              return (
                  next_month - timedelta(days=1)
              ).day


          # =================================================
          # COMPARISON PERIODS
          # =================================================

          current_start = date(
              current_year,
              current_month,
              1
          )

          current_end = yesterday

          previous_start = date(
              previous_year,
              current_month,
              1
          )

          previous_end_day = min(
              completed_day,
              last_day_of_month(
                  previous_year,
                  current_month
              )
          )

          previous_end = date(
              previous_year,
              current_month,
              previous_end_day
          )


          # =================================================
          # LOAD DAILY CACHE
          # =================================================

          if os.path.exists(DAILY_FILE):

              with open(
                  DAILY_FILE,
                  "r"
              ) as file:

                  daily_data = json.load(file)

          else:

              daily_data = {
                  "locations": {}
              }


          if "locations" not in daily_data:

              daily_data["locations"] = {}


          # =================================================
          # ENSURE LOCATION STRUCTURE
          # =================================================

          for zip_code in LOCATIONS:

              if zip_code not in daily_data["locations"]:

                  daily_data["locations"][zip_code] = {
                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"],

                      "days": {}
                  }

              elif "days" not in daily_data[
                  "locations"
              ][zip_code]:

                  daily_data[
                      "locations"
                  ][zip_code]["days"] = {}


          # =================================================
          # VISUAL CROSSING
          # =================================================

          total_query_cost = 0


          def get_weather(
              zip_code,
              start_date,
              end_date
          ):

              global total_query_cost

              url = (
                  "https://weather.visualcrossing.com/"
                  "VisualCrossingWebServices/rest/services/"
                  "timeline/"
                  f"{zip_code}/"
                  f"{start_date}/"
                  f"{end_date}"
                  "?unitGroup=us"
                  "&include=days"
                  "&elements="
                  "datetime,temp,tempmax,tempmin,precip"
                  f"&key={API_KEY}"
                  "&contentType=json"
              )

              print("")
              print(
                  "Visual Crossing request:",
                  flush=True
              )

              print(
                  f"  Location: {zip_code}",
                  flush=True
              )

              print(
                  f"  Dates: "
                  f"{start_date} through {end_date}",
                  flush=True
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "GitHub-Actions-Monthly-Weather/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      data = json.loads(
                          response.read().decode()
                      )

              except urllib.error.HTTPError as error:

                  try:

                      error_body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                  except Exception:

                      error_body = (
                          "Unable to read error response."
                      )

                  print("")
                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  print(
                      f"Visual Crossing HTTP ERROR "
                      f"{error.code}",
                      flush=True
                  )

                  print(
                      f"ZIP: {zip_code}",
                      flush=True
                  )

                  print(
                      f"Date range: "
                      f"{start_date} through {end_date}",
                      flush=True
                  )

                  print(
                      error_body,
                      flush=True
                  )

                  print(
                      "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!",
                      flush=True
                  )

                  raise RuntimeError(
                      f"Visual Crossing request failed "
                      f"with HTTP {error.code}."
                  )


              query_cost = data.get(
                  "queryCost",
                  0
              )

              total_query_cost += query_cost

              print(
                  f"  Query cost: {query_cost}",
                  flush=True
              )

              return data


          # =================================================
          # STORE DAYS
          # =================================================

          def store_days(
              zip_code,
              data
          ):

              for day in data.get("days", []):

                  weather_date = day.get(
                      "datetime"
                  )

                  if not weather_date:
                      continue

                  daily_data[
                      "locations"
                  ][
                      zip_code
                  ][
                      "days"
                  ][weather_date] = {

                      "temp":
                          day.get("temp"),

                      "tempmax":
                          day.get("tempmax"),

                      "tempmin":
                          day.get("tempmin"),

                      "precip":
                          day.get(
                              "precip",
                              0
                          ) or 0
                  }


          # =================================================
          # FIND MISSING DATES
          # =================================================

          def missing_dates(
              zip_code,
              start_date,
              end_date
          ):

              existing = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]

              missing = []

              current = start_date

              while current <= end_date:

                  if str(current) not in existing:

                      missing.append(current)

                  current += timedelta(days=1)

              return missing


          # =================================================
          # DOWNLOAD ONLY MISSING DAYS
          # =================================================

          BATCH_SIZE = 7


          for zip_code, location in LOCATIONS.items():

              print("")
              print(
                  "========================================",
                  flush=True
              )

              print(
                  f"Checking {location['name']}, "
                  f"{location['state']} "
                  f"{zip_code}",
                  flush=True
              )

              print(
                  "========================================",
                  flush=True
              )

              current_missing = missing_dates(
                  zip_code,
                  current_start,
                  current_end
              )

              previous_missing = missing_dates(
                  zip_code,
                  previous_start,
                  previous_end
              )

              print(
                  f"Missing current-year days: "
                  f"{len(current_missing)}",
                  flush=True
              )

              print(
                  f"Missing previous-year days: "
                  f"{len(previous_missing)}",
                  flush=True
              )


              # Current year

              for i in range(
                  0,
                  len(current_missing),
                  BATCH_SIZE
              ):

                  batch = current_missing[
                      i:i + BATCH_SIZE
                  ]

                  data = get_weather(
                      zip_code,
                      batch[0],
                      batch[-1]
                  )

                  store_days(
                      zip_code,
                      data
                  )


              # Previous year

              for i in range(
                  0,
                  len(previous_missing),
                  BATCH_SIZE
              ):

                  batch = previous_missing[
                      i:i + BATCH_SIZE
                  ]

                  data = get_weather(
                      zip_code,
                      batch[0],
                      batch[-1]
                  )

                  store_days(
                      zip_code,
                      data
                  )


          # =================================================
          # CALCULATE STATISTICS
          # =================================================

          def calculate(
              zip_code,
              start_date,
              end_date
          ):

              days = daily_data[
                  "locations"
              ][
                  zip_code
              ][
                  "days"
              ]

              temperatures = []
              highs = []
              lows = []

              rainfall = 0

              current = start_date

              while current <= end_date:

                  date_string = str(current)

                  if date_string not in days:

                      raise RuntimeError(
                          f"Missing cached weather data "
                          f"for {zip_code} on "
                          f"{date_string}."
                      )

                  day = days[date_string]

                  if day.get("temp") is not None:
                      temperatures.append(
                          day["temp"]
                      )

                  if day.get("tempmax") is not None:
                      highs.append(
                          day["tempmax"]
                      )

                  if day.get("tempmin") is not None:
                      lows.append(
                          day["tempmin"]
                      )

                  rainfall += (
                      day.get("precip", 0)
                      or 0
                  )

                  current += timedelta(days=1)


              return {

                  "avgTemp":
                      round(
                          sum(temperatures)
                          / len(temperatures),
                          1
                      ),

                  "highTemp":
                      max(highs),

                  "lowTemp":
                      min(lows),

                  "rainfall":
                      round(
                          rainfall,
                          2
                      )
              }


          # =================================================
          # CALCULATE RESULTS
          # =================================================

          results = {}


          for zip_code, location in LOCATIONS.items():

              current_stats = calculate(
                  zip_code,
                  current_start,
                  current_end
              )

              previous_stats = calculate(
                  zip_code,
                  previous_start,
                  previous_end
              )

              results[zip_code] = {

                  "name":
                      location["name"],

                  "state":
                      location["state"],

                  "current":
                      current_stats,

                  "previous":
                      previous_stats,

                  "change": {

                      "avgTemp":
                          round(
                              current_stats["avgTemp"]
                              -
                              previous_stats["avgTemp"],
                              1
                          ),

                      "highTemp":
                          round(
                              current_stats["highTemp"]
                              -
                              previous_stats["highTemp"],
                              1
                          ),

                      "lowTemp":
                          round(
                              current_stats["lowTemp"]
                              -
                              previous_stats["lowTemp"],
                              1
                          ),

                      "rainfall":
                          round(
                              current_stats["rainfall"]
                              -
                              previous_stats["rainfall"],
                              2
                          )
                  }
              }


          # =================================================
          # CREATE PHOCAS HISTORY.JSON
          # =================================================

          output = {

              "generated":
                  str(today),

              "month":
                  month_name,

              "currentYear":
                  current_year,

              "previousYear":
                  previous_year,

              "daysIncluded":
                  completed_day,

              "currentPeriod":
                  f"{current_start} through {current_end}",

              "previousPeriod":
                  f"{previous_start} through {previous_end}",

              "weather": [

                  {
                      "metric":
                          "Average Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["avgTemp"]
                          for zip_code in LOCATIONS
                      }
                  },

                  {
                      "metric":
                          "High Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["highTemp"]
                          for zip_code in LOCATIONS
                      }
                  },

                  {
                      "metric":
                          "Low Temperature",

                      "unit":
                          "°F",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["lowTemp"]
                          for zip_code in LOCATIONS
                      }
                  },

                  {
                      "metric":
                          "Rainfall",

                      "unit":
                          "in",

                      "current": {
                          zip_code:
                              results[zip_code][
                                  "current"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      },

                      "previous": {
                          zip_code:
                              results[zip_code][
                                  "previous"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      },

                      "change": {
                          zip_code:
                              results[zip_code][
                                  "change"
                              ]["rainfall"]
                          for zip_code in LOCATIONS
                      }
                  }
              ],

              "locations": [

                  {
                      "zip":
                          zip_code,

                      "name":
                          LOCATIONS[zip_code]["name"],

                      "state":
                          LOCATIONS[zip_code]["state"]
                  }

                  for zip_code in LOCATIONS
              ]
          }


          # =================================================
          # FORMAT CHANGE VALUES
          # =================================================

          def change_html(
              value,
              unit="°"
          ):

              if value > 0:

                  return (
                      '<span class="positive">'
                      f'+{value}{unit}'
                      '</span>'
                  )

              if value < 0:

                  return (
                      '<span class="negative">'
                      f'−{abs(value)}{unit}'
                      '</span>'
                  )

              return (
                  '<span class="neutral">'
                  f'0.0{unit}'
                  '</span>'
              )


          def rain_change_html(value):

              if value > 0:

                  return (
                      '<span class="positive">'
                      f'+{value:.2f}"'
                      '</span>'
                  )

              if value < 0:

                  return (
                      '<span class="negative">'
                      f'−{abs(value):.2f}"'
                      '</span>'
                  )

              return (
                  '<span class="neutral">'
                  '0.00"'
                  '</span>'
              )


          # =================================================
          # CREATE GITHUB PAGES HTML
          # =================================================

          ec = results["63045"]
          co = results["65202"]
          pa = results["42003"]


          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1.0">

          <title>
          {month_name} {current_year} Weather Comparison
          </title>

          <style>

          * {{
              box-sizing: border-box;
          }}

          body {{
              margin: 0;
              font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Helvetica,
                  Arial,
                  sans-serif;

              color: #172033;

              background:
                  linear-gradient(
                      135deg,
                      #eaf6ff 0%,
                      #f8fbff 45%,
                      #eef8f2 100%
                  );

              min-height: 100vh;
          }}


          .page {{
              max-width: 1100px;
              margin: 0 auto;
              padding: 35px 20px 50px;
          }}


          .hero {{
              position: relative;
              overflow: hidden;

              padding: 42px 38px;

              border-radius: 26px;

              color: white;

              background:
                  linear-gradient(
                      135deg,
                      #1677c8,
                      #35a9e8 55%,
                      #66c7b0
                  );

              box-shadow:
                  0 18px 45px
                  rgba(24, 91, 140, 0.20);

              margin-bottom: 28px;
          }}


          .hero::after {{
              content: "☀️";

              position: absolute;

              right: 35px;
              top: 20px;

              font-size: 100px;

              opacity: 0.18;
          }}


          .eyebrow {{
              font-size: 13px;
              font-weight: 700;
              letter-spacing: 2px;
              text-transform: uppercase;
              opacity: 0.85;
              margin-bottom: 8px;
          }}


          h1 {{
              margin: 0;

              font-size:
                  clamp(30px, 5vw, 48px);

              line-height: 1.05;
          }}


          .subtitle {{
              margin-top: 14px;

              font-size: 18px;

              opacity: 0.92;
          }}


          .period {{
              display: inline-block;

              margin-top: 18px;

              padding: 8px 13px;

              border-radius: 999px;

              background:
                  rgba(255,255,255,0.17);

              font-size: 13px;
          }}


          .card {{
              background: white;

              border-radius: 22px;

              overflow: hidden;

              box-shadow:
                  0 12px 35px
                  rgba(31, 66, 92, 0.10);

              margin-bottom: 24px;
          }}


          .table-wrap {{
              overflow-x: auto;
          }}


          table {{
              width: 100%;

              border-collapse: collapse;

              min-width: 760px;
          }}


          th {{
              padding: 22px 20px;

              background: #f4f8fc;

              color: #27445c;

              font-size: 15px;

              text-align: center;

              border-bottom:
                  1px solid #e4edf4;
          }}


          th:first-child {{
              text-align: left;
              width: 31%;
          }}


          td {{
              padding: 20px;

              border-bottom:
                  1px solid #edf2f6;

              text-align: center;

              font-size: 17px;
          }}


          td:first-child {{
              text-align: left;

              color: #31475a;

              font-weight: 600;
          }}


          tr:last-child td {{
              border-bottom: none;
          }}


          .location {{
              display: block;

              font-size: 18px;

              color: #173d59;
          }}


          .state {{
              display: block;

              margin-top: 3px;

              font-size: 12px;

              font-weight: 500;

              color: #7890a2;
          }}


          .metric {{
              font-size: 16px;
          }}


          .value {{
              font-size: 25px;

              font-weight: 750;

              color: #142d40;
          }}


          .comparison td {{
              padding-top: 7px;

              padding-bottom: 17px;

              background: #fbfdff;

              font-size: 14px;
          }}


          .comparison td:first-child {{
              color: #728697;

              font-weight: 600;
          }}


          .positive {{
              color: #17834b;

              font-weight: 750;
          }}


          .negative {{
              color: #2670b8;

              font-weight: 750;
          }}


          .neutral {{
              color: #758493;

              font-weight: 700;
          }}


          .legend {{
              display: flex;

              flex-wrap: wrap;

              gap: 18px;

              padding: 20px 24px;

              font-size: 13px;

              color: #637789;
          }}


          .legend span {{
              display: inline-flex;

              align-items: center;

              gap: 7px;
          }}


          .dot {{
              width: 9px;
              height: 9px;

              border-radius: 50%;

              display: inline-block;
          }}


          .green {{
              background: #17834b;
          }}


          .blue {{
              background: #2670b8;
          }}


          .gray {{
              background: #758493;
          }}


          .footer {{
              text-align: center;

              color: #718494;

              font-size: 12px;

              margin-top: 25px;

              line-height: 1.7;
          }}


          @media (max-width: 700px) {{

              .page {{
                  padding: 18px 12px 35px;
              }}

              .hero {{
                  padding: 30px 24px;
                  border-radius: 20px;
              }}

              .hero::after {{
                  font-size: 70px;
                  right: 15px;
                  top: 15px;
              }}

              td, th {{
                  padding-left: 14px;
                  padding-right: 14px;
              }}
          }}

          </style>

          </head>

          <body>

          <main class="page">

              <section class="hero">

                  <div class="eyebrow">
                      Weather at a Glance
                  </div>

                  <h1>
                      {month_name} {current_year}
                  </h1>

                  <div class="subtitle">
                      {month_name} {current_year}
                      vs. {month_name} {previous_year}
                  </div>

                  <div class="period">
                      Through {yesterday.strftime("%B %-d, %Y")}
                  </div>

              </section>


              <section class="card">

                  <div class="table-wrap">

                      <table>

                          <thead>

                              <tr>

                                  <th>
                                      Weather Metric
                                  </th>

                                  <th>
                                      <span class="location">
                                          Earth City
                                      </span>
                                      <span class="state">
                                          Missouri
                                      </span>
                                  </th>

                                  <th>
                                      <span class="location">
                                          Columbia
                                      </span>
                                      <span class="state">
                                          Missouri
                                      </span>
                                  </th>

                                  <th>
                                      <span class="location">
                                          Paducah
                                      </span>
                                      <span class="state">
                                          Kentucky
                                      </span>
                                  </th>

                              </tr>

                          </thead>

                          <tbody>


                              <tr>

                                  <td class="metric">
                                      🌡️ Average Temperature
                                  </td>

                                  <td>
                                      <span class="value">
                                          {ec["current"]["avgTemp"]}°
                                      </span>
                                  </td>

                                  <td>
                                      <span class="value">
                                          {co["current"]["avgTemp"]}°
                                      </span>
                                  </td>

                                  <td>
                                      <span class="value">
                                          {pa["current"]["avgTemp"]}°
                                      </span>
                                  </td>

                              </tr>


                              <tr class="comparison">

                                  <td>
                                      ↳ vs. Last Year
                                  </td>

                                  <td>
                                      {change_html(
                                          ec["change"]["avgTemp"]
                                      )}
                                  </td>

                                  <td>
                                      {change_html(
                                          co["change"]["avgTemp"]
                                      )}
                                  </td>

                                  <td>
                                      {change_html(
                                          pa["change"]["avgTemp"]
                                      )}
                                  </td>

                              </tr>


                              <tr>

                                  <td class="metric">
                                      🔥 High Temperature
                                  </td>

                                  <td>
                                      <span class="value">
                                          {ec["current"]["highTemp"]}°
                                      </span>
                                  </td>

                                  <td>
                                      <span class="value">
                                          {co["current"]["highTemp"]}°
                                      </span>
                                  </td>

                                  <td>
                                      <span class="value">
                                          {pa["current"]["highTemp"]}°
                                      </span>
                                  </td>

                              </tr>


                              <tr class="comparison">

                                  <td>
                                      ↳ vs. Last Year
                                  </td>

                                  <td>
                                      {change_html(
                                          ec["change"]["highTemp"]
                                      )}
                                  </td>

                                  <td>
                                      {change_html(
                                          co["change"]["highTemp"]
                                      )}
                                  </td>

                                  <td>
                                      {change_html(
                                          pa["change"]["highTemp"]
                                      )}
                                  </td>

                              </tr>


                              <tr>

                                  <td class="metric">
                                      ❄️ Low Temperature
                                  </td>

