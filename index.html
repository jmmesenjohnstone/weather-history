<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Monthly Weather Comparison</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 18px;
        background: #ffffff;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        color: #1f2937;
    }

    .weather-card {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #dbe3ec;
        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.08);
        background: #ffffff;
    }

    .header {
        background:
            linear-gradient(
                135deg,
                #1769aa,
                #2389c9
            );

        color: white;
        padding: 16px 20px;
    }

    .header-title {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
    }

    .header-subtitle {
        font-size: 12px;
        margin-top: 5px;
        opacity: 0.9;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    th,
    td {
        padding: 10px 8px;
        border-bottom: 1px solid #e5eaf0;
    }

    th {
        background: #f3f7fa;
        color: #1f3b53;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
    }

    th:first-child {
        width: 27%;
        text-align: left;
        padding-left: 18px;
    }

    th:not(:first-child) {
        width: 18.25%;
    }

    td {
        text-align: center;
        font-size: 15px;
        font-weight: 600;
    }

    td:first-child {
        text-align: left;
        padding-left: 18px;
        font-weight: 600;
        color: #334155;
    }

    tr:last-child td {
        border-bottom: none;
    }

    .metric-row td {
        background: #ffffff;
    }

    .change-row td {
        background: #f8fafc;
        font-size: 12px;
        font-weight: 500;
        color: #64748b;
    }

    .change-label {
        color: #64748b !important;
        font-size: 12px;
        font-weight: 500 !important;
        padding-left: 34px !important;
    }

    .positive {
        color: #16803c;
    }

    .negative {
        color: #c0392b;
    }

    .neutral {
        color: #64748b;
    }

    .location-name {
        display: block;
        font-size: 14px;
        font-weight: 700;
    }

    .location-state {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        font-weight: 400;
        color: #64748b;
    }

    .icon {
        margin-right: 5px;
    }

    .footer {
        padding: 8px 18px;
        background: #f8fafc;
        border-top: 1px solid #e5eaf0;
        color: #94a3b8;
        font-size: 9px;
        text-align: right;
    }

    .loading,
    .error {
        padding: 30px;
        text-align: center;
        color: #64748b;
        font-size: 14px;
    }

    .error {
        color: #c0392b;
    }

    @media (max-width: 700px) {

        body {
            padding: 5px;
        }

        .weather-card {
            border-radius: 6px;
        }

        .header {
            padding: 12px;
        }

        .header-title {
            font-size: 16px;
        }

        th,
        td {
            padding: 8px 4px;
        }

        th:first-child,
        td:first-child {
            padding-left: 8px;
        }

        th:first-child {
            width: 29%;
        }

        th:not(:first-child) {
            width: 17.75%;
        }

        td {
            font-size: 12px;
        }

        .location-name {
            font-size: 11px;
        }

        .location-state {
            font-size: 8px;
        }

        .change-row td {
            font-size: 10px;
        }

        .change-label {
            padding-left: 15px !important;
        }
    }

</style>
</head>

<body>

<div class="weather-card">

    <div class="header">

        <div class="header-title">
            🌤️ Monthly Weather Comparison
        </div>

        <div
            class="header-subtitle"
            id="period">
            Loading...
        </div>

    </div>


    <div id="weather-content">

        <div class="loading">
            Loading weather data...
        </div>

    </div>


    <div
        class="footer"
        id="updated">
        Updated: —
    </div>

</div>


<script>

async function loadWeather() {

    try {

        const response =
            await fetch(
                "history.json?cache=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "Unable to load history.json"
            );
        }

        const data =
            await response.json();

        buildTable(data);

    } catch (error) {

        document.getElementById(
            "weather-content"
        ).innerHTML =

            '<div class="error">' +
            'Unable to load weather data.' +
            '</div>';

        console.error(error);
    }
}


function buildTable(data) {

    const locations =
        data.locations || [];

    const weather =
        data.weather || [];


    if (
        locations.length === 0 ||
        weather.length === 0
    ) {

        throw new Error(
            "Weather data is incomplete."
        );

    }


    /*
     * -------------------------------------------------------
     * HEADER
     * -------------------------------------------------------
     */

    document.getElementById(
        "period"
    ).textContent =

        data.month +
        " " +
        data.currentYear +
        " vs. " +
        data.previousYear;


    document.getElementById(
        "updated"
    ).textContent =

        "Updated: " +
        data.generated;


    /*
     * -------------------------------------------------------
     * TABLE
     * -------------------------------------------------------
     */

    let html =

        '<table>' +

        '<thead>' +

        '<tr>' +

        '<th>Weather</th>';


    locations.forEach(
        location => {

            html +=

                '<th>' +

                '<span class="location-name">' +

                escapeHtml(
                    location.name
                ) +

                '</span>' +

                '<span class="location-state">' +

                escapeHtml(
                    location.state
                ) +

                '</span>' +

                '</th>';

        }
    );


    html +=

        '</tr>' +

        '</thead>' +

        '<tbody>';


    /*
     * -------------------------------------------------------
     * WEATHER ROWS
     * -------------------------------------------------------
     */

    weather.forEach(
        metric => {

            const metricName =
                metric.metric;

            const unit =
                metric.unit;


            let icon = "";


            if (
                metricName ===
                "Average Temperature"
            ) {

                icon = "🌡️";

            } else if (
                metricName ===
                "High Temperature"
            ) {

                icon = "🔥";

            } else if (
                metricName ===
                "Low Temperature"
            ) {

                icon = "❄️";

            } else if (
                metricName ===
                "Rainfall"
            ) {

                icon = "🌧️";

            }


            /*
             * Current values
             */

            html +=

                '<tr class="metric-row">' +

                '<td>' +

                '<span class="icon">' +
                icon +
                '</span>' +

                escapeHtml(
                    metricName
                ) +

                '</td>';


            locations.forEach(
                location => {

                    const value =
                        metric.current[
                            location.zip
                        ];


                    html +=

                        '<td>' +

                        formatValue(
                            metricName,
                            value,
                            unit
                        ) +

                        '</td>';

                }
            );


            html +=

                '</tr>';


            /*
             * Year-over-year change
             */

            html +=

                '<tr class="change-row">' +

                '<td class="change-label">' +

                '↳ vs. Last Year' +

                '</td>';


            locations.forEach(
                location => {

                    const change =
                        metric.change[
                            location.zip
                        ];


                    html +=

                        '<td class="' +
                        getChangeClass(change) +
                        '">' +

                        formatChange(
                            metricName,
                            change,
                            unit
                        ) +

                        '</td>';

                }
            );


            html +=

                '</tr>';

        }
    );


    html +=

        '</tbody>' +

        '</table>';


    document.getElementById(
        "weather-content"
    ).innerHTML = html;

}


/*
 * ---------------------------------------------------------
 * FORMAT CURRENT VALUE
 * ---------------------------------------------------------
 */

function formatValue(
    metric,
    value,
    unit
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }


    if (
        metric === "Rainfall"
    ) {

        return Number(value)
            .toFixed(2) +
            '"';

    }


    return Number(value)
        .toFixed(1) +
        "°";

}


/*
 * ---------------------------------------------------------
 * FORMAT CHANGE
 * ---------------------------------------------------------
 */

function formatChange(
    metric,
    value,
    unit
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }


    const number =
        Number(value);


    const sign =
        number > 0
            ? "+"
            : number < 0
                ? "−"
                : "";


    const absolute =
        Math.abs(number);


    if (
        metric === "Rainfall"
    ) {

        return (
            sign +
            absolute.toFixed(2) +
            '"'
        );

    }


    return (
        sign +
        absolute.toFixed(1) +
        "°"
    );

}


/*
 * ---------------------------------------------------------
 * COLOR CHANGE
 * ---------------------------------------------------------
 */

function getChangeClass(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "neutral";

    }


    if (
        Number(value) > 0
    ) {

        return "positive";

    }


    if (
        Number(value) < 0
    ) {

        return "negative";

    }


    return "neutral";

}


/*
 * ---------------------------------------------------------
 * BASIC HTML ESCAPING
 * ---------------------------------------------------------
 */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
 * ---------------------------------------------------------
 * LOAD DATA
 * ---------------------------------------------------------
 */

loadWeather();

</script>

</body>
</html>
